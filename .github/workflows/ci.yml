name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows leg: check out the way a default Git for Windows install does, so a
      # line-ending rewrite of a pinned file fails here instead of on a reader's machine.
      - name: Use the Git for Windows line-ending default
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: The vendored superstack files match their pins
        shell: bash
        run: cd third_party/superstack && sha256sum -c SUPERSTACK.sha256
      - name: Sealed files are checked out byte for byte
        shell: bash
        run: |
          git ls-files -s -- ":(attr:-text)" | while read -r mode sha stage path; do
            if [ "$(git hash-object --no-filters -- "$path")" != "$sha" ]; then
              echo "checkout rewrote a sealed file: $path"
              exit 1
            fi
          done
          echo "every sealed file matches its committed blob"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render and check the default certificate
        shell: bash
        run: |
          mkdir -p out
          if [ -x build/raw_native_cli ]; then cli=build/raw_native_cli; else cli=build/Release/raw_native_cli.exe; fi
          "$cli" --out out
          grep -q '"oracle":"raw-rt-ao-v1"' out/certificate.json
          grep -q '"schema":"superstack.receipt/1"' out/receipt.json
          grep -q '"verdict":"verified"' out/arena_certificate.json
          sha256sum out/frame.ppm out/certificate.json
      - name: Recheck the certificate from its files
        shell: bash
        run: |
          if [ -x build/raw_native_cli ]; then cli=build/raw_native_cli; else cli=build/Release/raw_native_cli.exe; fi
          "$cli" verify out
          if command -v python3 >/dev/null && python3 --version >/dev/null 2>&1; then py=python3; else py=python; fi
          "$py" scripts/recheck.py out
      - name: Keep the default render for the cross-platform identity check
        uses: actions/upload-artifact@v4
        with:
          name: default-render-${{ matrix.os }}
          path: |
            out/certificate.json
            out/receipt.json
            out/channels.json
            out/frame.ppm
            out/ao_rt.pfm
            out/ao_ss.pfm
      - name: The default build has no GPU backend and says so
        shell: bash
        run: |
          if [ -x build/raw_native_cli ]; then cli=build/raw_native_cli; else cli=build/Release/raw_native_cli.exe; fi
          ! grep -qi "d3d12.dll" "$cli"
          set +e; "$cli" --gpu --out gpu-none --width 64 --height 64 >/dev/null; rc=$?; set -e
          test "$rc" = 4
          grep -q '"verdict":"unverifiable"' gpu-none/gpu_certificate.json
          grep -q '"backend":"none"' gpu-none/gpu_certificate.json
      - name: Every web test file (frame graph golden, Motion, world, sound, shaders)
        shell: bash
        # Every *.test.mjs under web/, so a new test file needs no edit here.
        run: node --test $(find web -name '*.test.mjs' | sort)
      - name: Without a GPU backend, threads exits 4
        shell: bash
        run: |
          if [ -x build/raw_native_cli ]; then cli=build/raw_native_cli; else cli=build/Release/raw_native_cli.exe; fi
          set +e; "$cli" threads --out threads-none; rc=$?; set -e
          test "$rc" = 4
      - name: The generated HLSL and pass layout match the WGSL
        shell: bash
        run: |
          if command -v python3 >/dev/null && python3 --version >/dev/null 2>&1; then py=python3; else py=python; fi
          "$py" scripts/wgsl_to_hlsl.py --selftest
          "$py" scripts/wgsl_to_hlsl.py --check
      - name: Every include follows the layer rules (docs/architecture/ARCHITECTURE.md)
        shell: bash
        run: |
          if command -v python3 >/dev/null && python3 --version >/dev/null 2>&1; then py=python3; else py=python; fi
          "$py" scripts/check_layers.py --selftest
          "$py" scripts/check_layers.py
      - name: Every third-party file matches third_party/MANIFEST.md (M2 criterion 6)
        shell: bash
        run: |
          if command -v python3 >/dev/null && python3 --version >/dev/null 2>&1; then py=python3; else py=python; fi
          "$py" scripts/check_third_party.py --selftest
          "$py" scripts/check_third_party.py
      - name: Every case of the identity matrix matches the committed golden hashes
        # Ten renders (views, sizes, motion, no ray-traced pass, four threads)
        # and the no-GPU answer: every file each one writes, hashed. The golden
        # manifest is GCC's; MSVC must give the same bytes. arena_certificate.json
        # is left out because MSVC and libstdc++ allocate differently.
        shell: bash
        run: |
          if [ -x build/raw_native_cli ]; then cli=build/raw_native_cli; else cli=build/Release/raw_native_cli.exe; fi
          if command -v python3 >/dev/null && python3 --version >/dev/null 2>&1; then py=python3; else py=python; fi
          "$py" scripts/identity_matrix.py run "$cli" identity.json identity-out --no-gpu-build
          "$py" scripts/identity_matrix.py compare evidence/identity-golden.json identity.json --except arena_certificate.json
  d3d12:
    # Builds the native D3D12 backend with the Windows SDK's DXC. The runner has
    # no GPU: the hardware runtime test must report itself skipped with its
    # reason (exit 77), and --gpu must exit 4 with an unverifiable certificate.
    # WARP, the Windows software rasterizer, then runs the same D3D12 code path
    # on the CPU; it is not a GPU and its results are not GPU evidence.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with RAW_NATIVE_GPU_D3D12=ON
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAW_NATIVE_GPU_D3D12=ON
      - name: Build (compiles every HLSL pass to DXIL)
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: The hardware runtime test is skipped, with its reason, and never passes without a GPU
        shell: bash
        run: |
          set +e; build/Release/gpu_d3d12_runtime.exe | tee runtime.txt; rc=${PIPESTATUS[0]}; set -e
          if [ "$rc" = 77 ]; then
            reason=$(grep '^SKIP:' runtime.txt)
            test -n "$reason"
            echo "::notice title=D3D12 runtime test skipped::$reason"
          elif [ "$rc" = 0 ]; then
            grep -q '^adapter: ' runtime.txt
            ! grep -qi '^adapter: microsoft' runtime.txt
            echo "::notice title=D3D12 runtime test ran::$(grep '^adapter: ' runtime.txt)"
          else
            exit 1
          fi
      - name: Without an adapter, --gpu exits 4 with an unverifiable certificate
        shell: bash
        run: |
          set +e; build/Release/raw_native_cli.exe --gpu --out gpu-hw --width 64 --height 64; rc=$?; set -e
          if [ "$rc" = 4 ]; then
            grep -q '"verdict":"unverifiable"' gpu-hw/gpu_certificate.json
            grep -q '"backend":"d3d12"' gpu-hw/gpu_certificate.json
          else
            test "$rc" = 0 && grep -q '"verdict":"verified"' gpu-hw/gpu_certificate.json
            ! grep -q '"vendor":"microsoft"' gpu-hw/gpu_certificate.json
          fi
      - name: Threads compiles to DXIL and answers without an adapter
        # The Threads passes are compiled by DXC in the build step above. WARP
        # did not finish a 160 x 90 Threads frame in ten minutes, so the run
        # here only checks the no-adapter answer; hardware runs are in README.
        shell: bash
        run: |
          set +e; build/Release/raw_native_cli.exe threads --out threads-hw --width 64 --height 36 --particles 1024 --frames 1; rc=$?; set -e
          test "$rc" = 4 -o "$rc" = 0
      - name: The D3D12 code path on WARP (software, not a GPU) matches the CPU reference
        shell: bash
        env:
          RAW_NATIVE_D3D12_WARP: "1"
        run: |
          build/Release/gpu_d3d12_runtime.exe
          build/Release/raw_native_cli.exe --gpu --out gpu-warp --width 128 --height 128 --prev-eye 4.3,4,5.7 >/dev/null
          grep -q '"verdict":"verified"' gpu-warp/gpu_certificate.json
          grep -q '"description":"Microsoft Basic Render Driver"' gpu-warp/gpu_certificate.json
      - name: Textures, samplers and raster passes on WARP match the CPU sampler reference (M2 criterion 3)
        shell: bash
        env:
          RAW_NATIVE_D3D12_WARP: "1"
        run: |
          build/Release/gpu_texture_identity.exe texture-warp.json
          build/Release/raw_native_cli.exe texture-identity | grep -q '"pass": true'
          build/Release/raw_native_cli.exe verify gpu-warp
          build/Release/raw_native_cli.exe verify gpu-warp/cpu
          grep -q '"schema":"superstack.receipt/1"' gpu-warp/gpu_receipt.json
          grep -q '"identity":"MATCH"' gpu-warp/gpu_certificate.json
          cat gpu-warp/gpu_receipt.json
          cat gpu-warp/gpu_certificate.json
      - name: The frame graph on WARP verifies across the quick identity matrix
        shell: bash
        env:
          RAW_NATIVE_D3D12_WARP: "1"
        run: |
          python scripts/identity_matrix.py run build/Release/raw_native_cli.exe warp.json warp-out --gpu --quick
          n=$(grep -l '"verdict":"verified"' warp-out/*/gpu_certificate.json | wc -l)
          echo "verified GPU certificates: $n of 4"
          test "$n" = 4
  fuzz-sanitizers:
    # ROADMAP M2 criterion 2: one million fuzzed glTF inputs under AddressSanitizer and
    # UndefinedBehaviorSanitizer; any report, other exception or slow input fails the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the glTF fuzzer with the sanitizers
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake --build build-san --target fuzz_gltf -j 4
      - name: One million inputs
        run: build-san/fuzz_gltf 1000000 1 1000 gltf-fuzz.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: gltf-fuzz, path: gltf-fuzz.json, retention-days: 30 }
  wasm:
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: 6.0.11
      # The release wasm is built with CMake 4.2.0 (cmake/wasm.cmake). 4.2
      # adds -fPIC to Emscripten compiles, so another CMake changes the bytes.
      CMAKE_VERSION_PIN: 4.2.0
      CMAKE_SHA256: bbcebd4c433eab3af03a8c80bb5d84e8dfc3ff8a4ab9d01547b21240c23f7c2c
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned CMake
        run: |
          cd "$RUNNER_TEMP"
          f="cmake-$CMAKE_VERSION_PIN-linux-x86_64"
          curl -fsSLO "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION_PIN/$f.tar.gz"
          echo "$CMAKE_SHA256  $f.tar.gz" | sha256sum -c -
          tar -xzf "$f.tar.gz"
          echo "$RUNNER_TEMP/$f/bin" >> "$GITHUB_PATH"
      - name: CMake is the pinned version
        run: |
          cmake --version
          test "$(cmake --version | head -n1)" = "cmake version $CMAKE_VERSION_PIN"
      - name: Install emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"
      - name: Build native and wasm
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAW_NATIVE_BUILD_TESTS=OFF
          cmake --build build
          cmake --preset wasm
          cmake --build --preset wasm
          grep -qx 'CMAKE_CACHE_MAJOR_VERSION:INTERNAL=4' build-wasm/CMakeCache.txt
          grep -qx 'CMAKE_CACHE_MINOR_VERSION:INTERNAL=2' build-wasm/CMakeCache.txt
          grep -qx 'CMAKE_CACHE_PATCH_VERSION:INTERNAL=0' build-wasm/CMakeCache.txt
          grep -qx 'RAW_NATIVE_SUPERSTACK_COMPILES:INTERNAL=1' build-wasm/CMakeCache.txt
          sha256sum build-wasm/raw-native.wasm build-wasm/raw-native.mjs
      - name: The superstack vectors pass under Emscripten
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          mkdir -p build-vectors
          em++ -std=c++23 -O1 -fexceptions -sNODERAWFS=1 -sALLOW_MEMORY_GROWTH=1             -I third_party/superstack third_party/superstack/tests/run_vectors.cpp             -o build-vectors/run_vectors.js
          node build-vectors/run_vectors.js third_party/superstack
      - name: Keep the wasm build for comparison
        uses: actions/upload-artifact@v4
        with:
          name: raw-native-wasm-linux
          path: |
            build-wasm/raw-native.wasm
            build-wasm/raw-native.mjs
      - name: Build the WebGPU module (compiles WGSL into the binary; no GPU on the runner)
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset wasm-gpu
          cmake --build --preset wasm-gpu
          test -s build-wasm-gpu/raw-native-gpu.wasm
          sha256sum build-wasm-gpu/raw-native-gpu.wasm build-wasm-gpu/raw-native-gpu.mjs
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The WebGPU build's textures, samplers and raster passes match the CPU sampler reference in Chrome on SwiftShader (M2 criterion 3)
        run: |
          python -m pip install playwright==1.58.0
          python tests/web/rhi_texture.py --dir build-wasm-gpu --adapter swiftshader --out texture-webgpu.json
      - name: The default native build carries no GPU code
        run: |
          ! grep -q "emdawnwebgpu\|wgpu" build/raw_native_cli
          ! nm -C build/raw_native_cli 2>/dev/null | grep -q "wgpu"
      - name: Render both and compare certificates
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          build/raw_native_cli --out native >/dev/null
          node wasm/run-node.mjs build-wasm/raw-native.mjs wasm-out | tee wasm-run.txt >/dev/null
          ! grep -q '^receipt: not written' wasm-run.txt
          grep -q '"schema":"superstack.receipt/1"' wasm-out/receipt.json
          build/raw_native_cli verify wasm-out
          python3 scripts/recheck.py wasm-out
          python3 scripts/compare_renders.py native wasm-out
      - name: Keep the wasm default render for the cross-platform identity check
        uses: actions/upload-artifact@v4
        with:
          name: default-render-wasm
          path: |
            wasm-out/certificate.json
            wasm-out/receipt.json
            wasm-out/channels.json
            wasm-out/frame.ppm
            wasm-out/ao_rt.pfm
            wasm-out/ao_ss.pfm
  identity:
    # The default render's certificate, superstack receipt and pixels must be
    # the same bytes from MSVC on Windows, GCC on Linux and the WebAssembly build.
    needs: [build-test, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: default-render-*
      - name: Byte-identical across Windows, Linux and wasm
        run: |
          set -e
          for f in certificate.json receipt.json channels.json frame.ppm ao_rt.pfm ao_ss.pfm; do
            a=$(sha256sum "default-render-windows-latest/$f" | cut -d' ' -f1)
            b=$(sha256sum "default-render-ubuntu-24.04/$f" | cut -d' ' -f1)
            c=$(sha256sum "default-render-wasm/$f" | cut -d' ' -f1)
            echo "$f windows $a linux $b wasm $c"
            test "$a" = "$b" && test "$b" = "$c"
          done
          # receipt.json is in the loop above: from superstack v0.2.0 the wasm
          # build writes one too, and it must be the native receipt's bytes.
          grep -q '"scene_sha256":"84aa884f71fc47bf3fcc0a35eb795ac59cbf679f5f398263a27fc7dcca835b36"' default-render-ubuntu-24.04/receipt.json
          grep -q '"frame.rgb8":"0282ef9cc07a0012da9da3217c164f44d00a3e9f7704ff719770e832c9ca6d44"' default-render-ubuntu-24.04/receipt.json
      - name: Pixels, AO and certificate unchanged from v0.5.0
        # The hashes the v0.5.0 release wrote for the default render. The
        # certificate is compared with its renderer version string removed,
        # because that string is the one field a version bump changes.
        run: |
          set -e
          d=default-render-ubuntu-24.04
          cat > v050.sha256 <<'SUMS'
          e276f24f4a2a23e7b43b61d2e45147446468bf8d99a75809675f2cea91edb06d  frame.ppm
          3bd5cce0f7424363c04d17b7bf644b82a9f51338297b4666329d398e9fb886ee  ao_rt.pfm
          66c99812f843fe487eabb77e397fbe05e08864f981fd0b1179eba6fb78f86fb3  ao_ss.pfm
          33aaaabdbcf4e819f23e720584544ed21cb94d525cc2bce5d6a6faac12117eb3  channels.json
          SUMS
          sed 's/^ *//' v050.sha256 > "$d/v050.sha256"
          (cd "$d" && sha256sum -c v050.sha256)
          c=$(sed 's/"renderer":"raw-native [^"]*"/"renderer":"raw-native"/' "$d/certificate.json" | sha256sum | cut -d' ' -f1)
          echo "certificate.json without its version string: $c"
          test "$c" = fd0f81417e7d6ce807e409292fe5b5a40a581e56ba9d80156420b77d6f87e5a3
  media-smoke:
    # The release media path on a runner with no GPU: build, read the facts, record the
    # walkthrough, and render the first seconds of each scene on Chrome's CPU WebGPU adapter.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools (Playwright drives the installed Chrome; ffmpeg from imageio-ffmpeg)
        run: python -m pip install playwright==1.58.0 imageio-ffmpeg==0.6.0
      - name: Media spec tests
        run: python tools/media/test_media.py
      - name: Host textures, compositing and one shared device (M1 criterion 1), on the CPU adapter
        run: python tests/web/host_textures.py --adapter swiftshader
      - name: Shader library, physical CRT, GPU against the CPU reference within the committed bounds, on the CPU adapter
        run: python tests/web/shaders_parity.py --shader crt --adapter swiftshader --out media-out/shaders-crt-parity.json
      - name: Shader library, spectral film, GPU against the CPU reference within the committed bounds, on the CPU adapter
        run: python tests/web/shaders_parity.py --shader film --adapter swiftshader --out media-out/shaders-film-parity.json
      - name: Shader library, palette and dither, GPU palette indices equal the f64 reference's (M1 criterion 10), on the CPU adapter
        run: python tests/web/shaders_parity.py --shader dither --adapter swiftshader --out media-out/shaders-dither-parity.json
      - name: Shader library, crt-classic within 1/255 of retro-crt.js (M1 criterion 9), on the CPU adapter
        run: python tests/web/shaders_parity.py --shader classic --adapter swiftshader --out media-out/shaders-classic-parity.json
      - name: Shader library, painterly, GPU against the CPU reference within the committed bounds, on the CPU adapter
        run: python tests/web/shaders_parity.py --shader paint --adapter swiftshader --out media-out/shaders-paint-parity.json
      - name: Shader library, pixel art and scaling, GPU against the CPU reference within the committed bounds, on the CPU adapter
        run: python tests/web/shaders_parity.py --shader pixel --adapter swiftshader --out media-out/shaders-pixel-parity.json
      - name: Shader library, VHS, GPU against the CPU reference within the committed bounds, on the CPU adapter
        run: python tests/web/shaders_parity.py --shader vhs --adapter swiftshader --out media-out/shaders-vhs-parity.json
      - name: The sound engine's live path (AudioWorklet in Chrome) matches its offline render within the PCM tolerance
        run: |
          node web/sound/smoke.mjs build/sound-smoke
          python scripts/sound_live_check.py build/sound-smoke
      - name: Render four seconds of each scene on the CPU WebGPU adapter
        run: python tools/media/raw_native_media.py render --setup --out media-out --adapter swiftshader --width 960 --height 540 --max-seconds 4
      - name: Every equation in raw-native's scenes renders from the TeX subset (M1 criterion 5)
        run: node tools/media/tex_coverage.mjs --scenes docs/motion --atlas docs/motion/hanken-grotesk-500.atlas.json --scenes docs/media/scenes --atlas docs/motion/hanken-grotesk-500.atlas.json
      - name: Colour pipelines in WGSL match the C++ reference within one 8-bit code (M1 criterion 2)
        run: python tests/web/colour_grid.py --cli build/raw_native_cli --adapter swiftshader
      - name: Extended-range output reaches the canvas and matches the C++ reference (M1 criterion 3, engine half)
        run: python tests/web/hdr_output.py --cli build/raw_native_cli --adapter swiftshader
      - name: The vector corpus on the GPU matches the CPU reference within its bounds (M1 criterion 4)
        run: python tests/web/vector_corpus.py --adapter swiftshader
      - name: Post passes match their CPU references; the stack runs inside Motion (M1 criteria 9 and 10)
        run: python tests/web/post_passes.py --adapter swiftshader --modules web/shaders/post.mjs
      - name: Tile loaders survive 50,000 fuzzed inputs (the full million is in evidence/), and the tile pass matches its CPU twin (M2 criterion 10)
        run: |
          node tools/fuzz/tiles_fuzz.mjs --n 50000 > /dev/null
          python tests/web/tiles_check.py --adapter swiftshader
      - name: Vertex snap and affine UVs match their CPU twin on the committed mesh set (M2 criterion 8)
        run: python tests/web/retro3d_check.py --adapter swiftshader
      - name: The isometric fade on the GPU matches its CPU twin and changes only the faded cells (M2 criterion 9)
        run: python tests/web/iso_fade.py --adapter swiftshader
      - name: The style template scaffolds render, the same twice (ADR 0016)
        run: python tests/web/templates_check.py --adapter swiftshader --seconds 1
      - name: Low-resolution frames scale to the output exactly, and a slow pan moves edges smoothly (M2 criterion 7)
        run: python tests/web/pixel_scaling.py --adapter swiftshader
      - name: Every scene wrote a video, a poster, captions and a manifest, from this commit
        shell: bash
        run: |
          for id in ao-check first-run; do
            d="media-out/$id"
            test -s "$d/$id-540p.mp4" && test -s "$d/poster.jpg" && test -s "$d/$id.vtt" && test -s "$d/index.html"
            python -c "import json,sys; m=json.load(open('$d/media.json')); assert m['commit']=='$GITHUB_SHA', m['commit']; assert m['adapter_kind']=='swiftshader'; assert m['frames']>=100; print('$id', m['frames'], 'frames', m['frame_ms_median'], 'ms median')"
          done
          python -c "import json; f=json.load(open('media-out/ao-check/facts.json'))['facts']; print({k: f[k]['value'] for k in ('version','verdict','rmse','tolerance','pixels')})"
      - name: Each smoke render stays inside its wall-clock budget
        run: python tools/media/budget.py media-out --smoke
      - name: Two renders of the same seconds draw identical frames
        run: python tools/media/determinism.py first-run --adapter swiftshader --width 640 --height 360 --max-seconds 2 --out media-out/determinism.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: media-smoke, path: media-out, retention-days: 7 }
