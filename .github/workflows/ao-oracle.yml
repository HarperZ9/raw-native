name: ao-oracle
# The BVH-backed AO reference against its test-only oracle (evidence/m3-ao-bvh-bounds.json).
# The default build's CPU outputs for the identity matrix and the ten glTF models, three ways:
# the BVH (the default), the scan of every triangle (RAW_NATIVE_AO_ORACLE=scan) and the skew
# control (RAW_NATIVE_AO_ORACLE=skew). The BVH must equal the scan and the committed goldens; the
# skew control must differ.
on:
  pull_request:
    paths:
      - 'src/renderer/accel.cpp'
      - 'src/renderer/ray_ao.cpp'
      - 'src/renderer/bvh.cpp'
      - 'raw/renderer/accel.hpp'
      - 'raw/renderer/bvh.hpp'
      - 'evidence/m3-ao-bvh-*'
      - '.github/workflows/ao-oracle.yml'
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the default CLI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRAW_NATIVE_BUILD_TESTS=ON
          cmake --build build -j 4 --target raw_native_cli test_ao_bvh
      - name: g1 and g4 (unit guard and its skew control) and g5 (times)
        run: build/test_ao_bvh | tee ao-unit.txt
      - name: The identity matrix and the glTF models three ways
        run: |
          python3 tools/assets/fetch_gltf.py gltf-models
          c=build/raw_native_cli; m=scripts/identity_matrix.py
          for mode in bvh scan skew; do
            o=""; [ "$mode" != bvh ] && o=$mode
            RAW_NATIVE_AO_ORACLE=$o python3 $m run $c id-$mode.json id-$mode --no-gpu-build > id-$mode.log 2>&1 || true
            RAW_NATIVE_AO_ORACLE=$o python3 $m run $c gltf-$mode.json gltf-$mode --models gltf-models > gltf-$mode.log 2>&1 || true
          done
      - name: g3 the BVH equals the scan, every file including the arena certificate
        run: |
          python3 scripts/identity_matrix.py compare id-scan.json id-bvh.json
          python3 scripts/identity_matrix.py compare gltf-scan.json gltf-bvh.json
      - name: g2 the BVH equals the committed goldens (as the main CI compares them)
        run: |
          python3 scripts/identity_matrix.py compare evidence/identity-golden.json id-bvh.json --except arena_certificate.json
          python3 scripts/identity_matrix.py compare evidence/m2-gltf-golden.json gltf-bvh.json --except arena_certificate.json
          echo "with the arena certificate (recorded, informational):"
          python3 scripts/identity_matrix.py compare evidence/identity-golden.json id-bvh.json || true
      - name: g4 the skew control differs from the scan
        run: |
          if python3 scripts/identity_matrix.py compare id-scan.json id-skew.json; then echo "skew control did not differ: the compare is blind"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ao-oracle, path: "ao-unit.txt\nid-*.json\ngltf-*.json", retention-days: 30 }
