# Render a repo's media at a release tag, on hosted runners with no GPU, and attach it to
# the release. Reusable: a repo calls it from its release workflow (docs/architecture/adr/0012-media-engine.md).
#
#   jobs:
#     media:
#       uses: HarperZ9/raw-native/.github/workflows/media.yml@main
#       with: { tag: "${{ github.event.release.tag_name }}" }
#       permissions: { contents: write }
#
# Each scene renders in its own job, on Chrome's CPU WebGPU adapter (SwiftShader), at
# 960 x 540 with captions and no narration. On the hosted runner that costs about 0.7 s a
# frame for an explainer and 0.35 s for a walkthrough; at 1280 x 720 the v0.6.0 explainer
# took 1.8 s a frame (42 minutes) and the two scenes in one job ran past the 90-minute
# limit. The narrated 4K render is made on the author's machine and replaces these files
# with `raw-native media attach`.
name: media
on:
  workflow_call:
    inputs:
      tag: { description: "Release tag to render and attach to", required: true, type: string }
      spec: { description: "Media spec in the calling repo", required: false, type: string, default: docs/media/media.json }
      setup: { description: "Run the spec's setup commands (a build) first", required: false, type: boolean, default: true }
      engine_ref: { description: "raw-native ref to render with", required: false, type: string, default: main }
      upload: { description: "Attach the outputs to the release", required: false, type: boolean, default: true }
      max_seconds: { description: "Render only the first N seconds (0: all)", required: false, type: number, default: 0 }
      width: { description: "Frame width", required: false, type: number, default: 960 }
      height: { description: "Frame height", required: false, type: number, default: 540 }
permissions:
  contents: write
jobs:
  scenes:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - id: ids
        env: { SPEC: "${{ inputs.spec }}" }
        run: echo "ids=$(python3 -c "import json,os; print(json.dumps([s['id'] for s in json.load(open(os.environ['SPEC']))['scenes']]))")" >> "$GITHUB_OUTPUT"
  render:
    needs: scenes
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(needs.scenes.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}", fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: HarperZ9/raw-native, ref: "${{ inputs.engine_ref }}", path: .raw-native }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools (Playwright drives the installed Chrome; ffmpeg from imageio-ffmpeg)
        run: python -m pip install playwright==1.58.0 imageio-ffmpeg==0.6.0
      - name: Render on the CPU WebGPU adapter
        env:
          SPEC: ${{ inputs.spec }}
          SETUP: ${{ inputs.setup && '--setup' || '' }}
          MAX: ${{ inputs.max_seconds }}
          W: ${{ inputs.width }}
          H: ${{ inputs.height }}
          SCENE: ${{ matrix.scene }}
        run: |
          extra=""
          if [ "$MAX" != "0" ]; then extra="--max-seconds $MAX"; fi
          python .raw-native/tools/media/raw_native_media.py render "$SCENE" --spec "$SPEC" $SETUP --out media-out \
            --adapter swiftshader --width "$W" --height "$H" $extra
      - uses: actions/upload-artifact@v4
        with: { name: "media-${{ inputs.tag }}-${{ matrix.scene }}", path: media-out, retention-days: 30 }
      - name: Attach to the release
        if: ${{ inputs.upload }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python .raw-native/tools/media/raw_native_media.py attach media-out --tag "$TAG" --repo "${{ github.repository }}"
