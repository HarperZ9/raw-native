# raw-native's own media: rendered and attached when a release is published.
name: release-media
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag", required: true, type: string }
      engine_ref: { description: "raw-native ref to render with (default: the tag)", required: false, type: string, default: "" }
permissions:
  contents: write
jobs:
  media:
    uses: ./.github/workflows/media.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      engine_ref: ${{ inputs.engine_ref || github.event.release.tag_name || inputs.tag }}
