# raw-native's own media: rendered and attached when a release is published.
name: release-media
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag", required: true, type: string }
      engine_ref: { description: "raw-native ref to render with (default: the tag)", required: false, type: string, default: "" }
permissions:
  contents: write
jobs:
  discover:
    # Blocks the release when the repository is missing what search and
    # registries read. Report and fixes: the job log. Tool: HarperZ9/discover.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: HarperZ9/discover@98138514412bbe283e5f70dfd9139d34382dad35 # v0.1.2
        with:
          mode: repo

  media:
    needs: discover
    uses: ./.github/workflows/media.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      engine_ref: ${{ inputs.engine_ref || github.event.release.tag_name || inputs.tag }}
