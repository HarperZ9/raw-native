<!doctype html>
<meta charset="utf-8">
<title>EHT sag: GPU against the CPU reference</title>
<link rel="icon" href="data:,">
<!-- Run by tests/web/shaders_parity.py --shader sag. Each case of
     evidence/shaders-sag-parity-bounds.json through sag.mjs (CPU, float64) and sag/gpu.mjs,
     compared as 8-bit R'G'B' codes. -->
<script type="module">
import { createHost } from "../raw-gpu.mjs";
import { resolveSag, runSag, signal8 } from "../shaders/sag/sag.mjs";
import { createGpuSag } from "../shaders/sag/gpu.mjs";
import { labSource } from "../shaders/lab/sources.mjs";
import { codeStats } from "../shaders/lab/gpu-kit.mjs";
const q = new URLSearchParams(location.search);
try {
  const host = await createHost({ timing: false });
  const gpuErrors = []; host.device.onuncapturederror = (e) => gpuErrors.push(e.error.message);
  const bounds = await (await fetch("../../evidence/shaders-sag-parity-bounds.json")).json(), { width: W, height: H } = bounds.output;
  const cases = [];
  for (const c of bounds.cases) {
    if (q.get("case") && q.get("case") !== c.id) continue;
    const src = c.frame === "game" ? labSource("game", 256, 224, 1) : labSource(c.frame === "street" ? "street-signal" : c.frame, W, H), size = { w: src.width, h: src.height };
    const want = signal8(runSag(resolveSag(c.preset, {}, size), src).out);
    const g = await createGpuSag(host, c.preset, {}, size); g.frame(src.data);
    const got = (await g.read()).packed; g.destroy();
    cases.push({ id: c.id, size, ...codeStats(want, got) });
  }
  await host.done();
  window.__result = { bounds: bounds.bounds, cases, adapter: host.info, gpuErrors };
} catch (e) { window.__result = { error: String(e && e.stack || e) }; }
</script>
