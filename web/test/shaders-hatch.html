<!doctype html>
<meta charset="utf-8">
<title>Curvature hatching: GPU against the CPU reference</title>
<link rel="icon" href="data:,">
<!-- Run by tests/web/shaders_parity.py --shader hatch. Each case of
     evidence/shaders-hatch-parity-bounds.json through hatch.mjs (CPU, float64) and
     hatch/gpu.mjs, compared as 8-bit sRGB codes. -->
<script type="module">
import { createHost } from "../raw-gpu.mjs";
import { resolveHatch, runHatch } from "../shaders/hatch/hatch.mjs";
import { displayEncode8 } from "../shaders/purity/purity.mjs";
import { createGpuHatch } from "../shaders/hatch/gpu.mjs";
import { codeStats } from "../shaders/lab/gpu-kit.mjs";
const q = new URLSearchParams(location.search);
try {
  const host = await createHost({ timing: false });
  const gpuErrors = []; host.device.onuncapturederror = (e) => gpuErrors.push(e.error.message);
  const bounds = await (await fetch("../../evidence/shaders-hatch-parity-bounds.json")).json(), { width: W, height: H } = bounds.output;
  const cases = [];
  for (const c of bounds.cases) {
    if (q.get("case") && q.get("case") !== c.id) continue;
    const size = { w: W, h: H };
    const want = displayEncode8(runHatch(resolveHatch(c.preset, {}, size)));
    const g = await createGpuHatch(host, c.preset, {}, size); g.frame();
    const got = (await g.read()).packed; g.destroy();
    const st = codeStats(want, got); cases.push({ id: c.id, ...st, over2_fraction: st.over2 / st.n });
  }
  await host.done();
  window.__result = { bounds: bounds.bounds, cases, adapter: host.info, gpuErrors };
} catch (e) { window.__result = { error: String(e && e.stack || e) }; }
</script>
