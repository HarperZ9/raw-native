<!doctype html>
<meta charset="utf-8">
<title>HDR signal check</title>
<!-- M1 exit criterion 3 (amended 2026-10-10), the GPU half: the WGSL HDR pipelines over the
     committed grid, read back as float32, against the C++ output. Bounds are in
     evidence/m1-hdr-signal-bounds.json. A control with a wrong PQ exponent must fail.
     Driven by tests/web/hdr_signal.py, which serves the grid and the C++ outputs under /_data/. -->
<script type="module">
import { applyColour, colourWGSL } from '../colour/colour.mjs';
const f32 = async url => new Float32Array(await (await fetch(url)).arrayBuffer());
const json = async url => (await fetch(url)).json();
const CODE10 = 1 / 1023;
const BOUNDS = {
  'aces2-hdr1000/rec2100-pq': cpu => CODE10,
  'aces2-hdr1000/srgb-extended': cpu => Math.max(CODE10, 0.005 * Math.abs(cpu)),
};
function compare(name, gpu, cpu, grid) {
  let maxAbs = 0, maxRatio = 0, over = 0, nan = 0, worst = 0;
  // Where the values over the bound sit, by the C++ signal: near zero, below 1, at 1 and above.
  const overBy = { 'abs<0.05': 0, '0.05..1': 0, '>=1': 0 };
  const failing = [];   // every channel over the bound (up to 400), for the CPU diagnosis
  for (let i = 0; i < cpu.length; ++i) {
    if (!Number.isFinite(gpu[i])) { ++nan; continue; }
    const d = Math.abs(gpu[i] - cpu[i]), r = d / BOUNDS[name](cpu[i]);
    if (r > 1) {
      ++over; const a = Math.abs(cpu[i]); ++overBy[a < 0.05 ? 'abs<0.05' : a < 1 ? '0.05..1' : '>=1'];
      if (failing.length < 400) failing.push({ index: i, input: Array.from(grid.slice(i - i % 3, i - i % 3 + 3)), channel: i % 3, gpu: gpu[i], cpu: cpu[i] });
    }
    if (r > maxRatio) { maxRatio = r; worst = Math.floor(i / 3); }
    maxAbs = Math.max(maxAbs, d);
  }
  return { maxAbs, maxRatio, over, overBy, failing, nan, worstInput: Array.from(grid.slice(worst * 3, worst * 3 + 3)),
    worstGpu: Array.from(gpu.slice(worst * 3, worst * 3 + 3)), worstCpu: Array.from(cpu.slice(worst * 3, worst * 3 + 3)) };
}
async function run() {
  if (!navigator.gpu) return { error: 'no WebGPU' };
  let adapter = null;
  for (let i = 0; i < 20 && !adapter; ++i) { adapter = await navigator.gpu.requestAdapter(); if (!adapter) await new Promise(r => setTimeout(r, 250)); }
  if (!adapter) return { error: 'no adapter' };
  const device = await adapter.requestDevice();
  const info = adapter.info || {};
  const grid = await f32('/_data/grid.f32');
  const out = { adapter: `${info.vendor || ''} ${info.architecture || ''} ${info.description || ''}`.trim(), inputs: grid.length / 3, pipelines: {} };
  for (const name of Object.keys(BOUNDS)) {
    const file = name.replace('/', '_');
    const tables = await json(`/_data/${file}.json`);
    const cpu = await f32(`/_data/${file}.f32`);
    out.pipelines[name] = compare(name, await applyColour(device, name, grid, tables), cpu, grid);
  }
  // The control: PQ's m1 with the factor of 4 dropped. It must exceed the bound.
  const src = await colourWGSL();
  const wrong = src.replace('2610.0 / 16384.0', '2610.0 / 4096.0');
  const name = 'aces2-hdr1000/rec2100-pq', file = name.replace('/', '_');
  out.control = { what: 'pq_encode with m1 = 2610/4096', replaced: wrong !== src,
    ...compare(name, await applyColour(device, name, grid, await json(`/_data/${file}.json`), wrong), await f32(`/_data/${file}.f32`), grid) };
  device.destroy();
  return out;
}
run().then(r => { window.__result = r; }, e => { window.__result = { error: String(e && e.stack || e) }; });
</script>
