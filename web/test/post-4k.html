<!doctype html>
<meta charset="utf-8">
<title>Post stack at 4K</title>
<!-- The post stack at 3840 x 2160 (tests/web/post_4k.py). A 4K frame is 8,294,400 pixels: a pass
     that dispatches one 64-wide group per 64 pixels in one dimension asks for 129,600 groups, over
     WebGPU's 65,535 a dimension, so the dispatch is refused and the frame comes out black while the
     render reports success. Each pass here draws a gradient at 4K; the frame must carry the image
     (8-bit standard deviation of at least 2) and the device must report no validation error. -->
<script type="module">
import { PostRunner } from '../motion/post_run.mjs';
import { getPass } from '../motion/post.mjs';
import { createHost } from '../raw-gpu.mjs';

const W = 3840, H = 2160;
// pass name, its spec: a byte-plate effect (pack, effect, unpack) and the two encoders (film, crt).
const CASES = [
  ['dither', { palette: 'pico8', mode: 'bayer4' }],
  ['film', { preset: '500t-print' }],
  ['crt', { preset: 'pvm-20' }],
];

function toHalfBits(v) {
  const f = new Float32Array(1), u = new Uint32Array(f.buffer);
  f[0] = v; const x = u[0], s = (x >>> 16) & 0x8000, e = ((x >>> 23) & 0xff) - 112, m = x & 0x7fffff;
  if (e <= 0) return s; if (e >= 31) return s | 0x7c00;
  return s | (e << 10) | (m >>> 13);
}
function fromHalfBits(h) {
  const s = h & 0x8000 ? -1 : 1, e = (h >>> 10) & 31, m = h & 1023;
  if (e === 0) return s * m * 2 ** -24; if (e === 31) return m ? NaN : s * Infinity;
  return s * (1 + m / 1024) * 2 ** (e - 15);
}

async function run() {
  await import('../shaders/post.mjs');
  const host = await createHost({ timing: false });
  const device = host.device;
  const errors = [];
  device.addEventListener('uncapturederror', (e) => errors.push(String((e.error && e.error.message) || e.error)));
  const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
  // A diagonal gradient with a coloured band, as half floats.
  const half = new Uint16Array(W * H * 4);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = 4 * (y * W + x), g = (x + y) / (W + H);
    half[i] = toHalfBits(g); half[i + 1] = toHalfBits(0.25 + 0.5 * (y / H)); half[i + 2] = toHalfBits(1 - g); half[i + 3] = toHalfBits(1);
  }
  const res = { adapter: (host.adapter.info && host.adapter.info.description) || '', size: [W, H], cases: [] };
  for (const [name, spec] of CASES) {
    const pass = getPass(name), before = errors.length;
    const src = device.createTexture({ size: [W, H], format: 'rgba16float', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SRC });
    device.queue.writeTexture({ texture: src }, half, { bytesPerRow: W * 8 }, [W, H]);
    const dst = device.createTexture({ size: [W, H], format: 'rgba16float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const runner = new PostRunner(host, sampler);
    const list = [{ pass: name, ...spec }];
    await runner.prepare(list, W, H);
    const enc = device.createCommandEncoder();
    runner.run(enc, list, src, W, H, 0, 0, { view: dst.createView(), format: 'rgba16float' }, pass.stage);
    const bpr = Math.ceil(W * 8 / 256) * 256, read = device.createBuffer({ size: bpr * H, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    enc.copyTextureToBuffer({ texture: dst }, { buffer: read, bytesPerRow: bpr }, [W, H]);
    device.queue.submit([enc.finish()]);
    await read.mapAsync(GPUMapMode.READ);
    const raw = new Uint16Array(read.getMappedRange());
    // 8-bit luma over a 1-in-16 grid of pixels.
    let n = 0, sum = 0, sum2 = 0;
    for (let y = 0; y < H; y += 16) for (let x = 0; x < W; x += 16) {
      const o = y * bpr / 2 + 4 * x;
      const l = 0.2126 * fromHalfBits(raw[o]) + 0.7152 * fromHalfBits(raw[o + 1]) + 0.0722 * fromHalfBits(raw[o + 2]);
      const c = Math.round(255 * Math.min(1, Math.max(0, l)));
      n++; sum += c; sum2 += c * c;
    }
    read.unmap(); read.destroy(); src.destroy(); dst.destroy(); runner.destroy();
    const mean = sum / n, sd = Math.sqrt(Math.max(0, sum2 / n - mean * mean));
    res.cases.push({ pass: name, mean, sd, errors: errors.slice(before, before + 5) });
  }
  device.destroy();
  return res;
}
run().then((r) => { window.__result = r; }, (e) => { window.__result = { error: String(e && e.stack || e) }; });
</script>
